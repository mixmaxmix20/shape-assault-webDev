<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        #main {
            width: 640px;
            height: 480px;
            margin: auto;
            border: 1px solid black;
            background-color: navajowhite;
        }
    </style>

    <script>
        let canvas;
        let ctx;

        let welcome_screen = true;
        let game_over = false;
        let pause = false;
        let levelUpScreen = false;
        let levelUpOptions = [];
        let levelUpScreenOpenTime = 0;
        const levelUpScreenDelay = 750;

        let player_pos_x = 320, player_pos_y = 300;
        const keys = {}
        let mouse_x = 0;
        let mouse_y = 0;
        let HERO_SPEED = 1
        let hero_hp = 100
        let hero_max_hp = 100
        const HERO_SAFE_ZONE = 150;
        let hero_xp = 0;
        let hero_lvl = 1;
        let hero_dmg = 1;
        let xp_to_next_level = 1000;
        const PROJECTILE_SPEED = 5
        const ENEMY_SPEED = 1
        const enemySpawnCooldown = 1500;
        const base_enemy_hp = 1;
        let enemy_hp = base_enemy_hp;
        const base_enemy_xp = 100;
        let enemy_xp = base_enemy_xp;
        const base_enemy_dmg = 5;
        let enemy_dmg = base_enemy_dmg;
        const HIT_COOLDOWN = 1000;
        let last_time_hit = 0;
        const projectiles = [];
        const enemies = [];
        const pickups = [];

        let killed_enemies = 0;

        let spawnInterval = null;

        /**
         * Funkcja czyszcząca ekran powitalny
         */
        function clear_welcome() {
            if (welcome_screen) {
                ctx.clearRect(0, 0, 640, 480);
                welcome_screen = false;
                requestAnimationFrame(gameLoop);
                spawnInterval = setInterval(spawnWave, enemySpawnCooldown)
            }
        }

        /**
         * Funkcja obsługująca koniec rozgrywki
         */
        function handleGameOver() {
            game_over = true;
            clearInterval(spawnInterval);

            ctx.clearRect(0, 0, 640, 480);

            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', 320, 240);

            ctx.font = '24px sans-serif';
            ctx.fillText('Poziom: ' + hero_lvl, 320, 280);
            ctx.fillText('Pokonani przeciwnicy: ' + killed_enemies, 320, 320);
            ctx.fillText('Naciśnij R aby zagrać ponownie', 320, 360);
        }
        /**
         * Funkcja rysująca bohatera na tkaninie
         */
        function draw_hero() {
            const angle = Math.atan2(mouse_y - player_pos_y, mouse_x - player_pos_x);
            ctx.save();
            ctx.fillStyle = 'rgb(43,255,0)';
            ctx.translate(player_pos_x, player_pos_y);
            ctx.rotate(angle);
            ctx.fillRect(-5, -15, 10, 30);

            ctx.beginPath();
            ctx.arc(3, 0, 8, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgb(78 78 179)';
            ctx.fill();

            ctx.fillRect(5, 15, 8, 1);
            ctx.restore();
        }

        /**
         * Funkcja tworząca przedmioty do podniesienia
         */
        function spawnPickup(e_pos_x, e_pos_y) {
            const randomNum = Math.random();
            if (randomNum < 0.03) {
                pickups.push({x: e_pos_x, y: e_pos_y, type: 'hp'});
            }
        }

        /**
         * Funkcja rysująca przedmioty na ekranie
         */
        function drawPickup(pickup) {

            ctx.save();
            ctx.translate(pickup.x, pickup.y);
            ctx.fillStyle = 'rgb(255,0,0)';
            ctx.fillRect(-8, -3, 16, 6);
            ctx.fillRect(-3, -8, 6, 16);

            ctx.beginPath();
            ctx.moveTo(-8, -3);
            ctx.lineTo(-3, -3);
            ctx.lineTo(-3, -8);
            ctx.lineTo( 3, -8);
            ctx.lineTo( 3, -3);
            ctx.lineTo( 8, -3);
            ctx.lineTo( 8,  3);
            ctx.lineTo( 3,  3);
            ctx.lineTo( 3,  8);
            ctx.lineTo(-3,  8);
            ctx.lineTo(-3,  3);
            ctx.lineTo(-8,  3);
            ctx.closePath();

            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        function showLevelUpScreen() {
            levelUpScreen = true;
            levelUpScreenOpenTime = performance.now();
            levelUpOptions = [
                { id: 'hp', label: 'HP +20', action: () => { hero_max_hp += 20; hero_hp = hero_max_hp; }},
                { id: 'dmg', label: 'Obrażenia +1', action: () => {hero_dmg++; } },
                { id: 'speed', label: 'Szybkość +1', action: () => { HERO_SPEED++; } },
            ]
        }

        function drawLevelUpScreen() {
            if (!levelUpScreen) return;
            ctx.save();
            ctx.fillStyle = 'navajowhite';
            ctx.fillRect(80, 80, 480, 320);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(80, 80, 480, 320);


            ctx.fillStyle = 'black';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Wybierz ulepszenie:', 320, 120);


            levelUpOptions.forEach((option, i) => {
                const x = 100 + i * 170;
                const y = 180;
                const w = 100;
                const h = 160;

                ctx.fillStyle = 'rgb(203,203,203)';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);

                ctx.fillStyle = 'black';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(option.label, x + w / 2, y + 20);
                if (option.id === 'hp') {

                    const cx = x + w / 2;
                    const cy = y + h / 2;

                    ctx.fillStyle = 'rgb(255,0,0)';
                    ctx.fillRect(cx - 15, cy, 30, 10);
                    ctx.fillRect(cx - 5, cy - 10, 10, 30);

                    ctx.beginPath();
                    ctx.moveTo(cx - 15, cy);
                    ctx.lineTo(cx - 5,  cy);
                    ctx.lineTo(cx - 5,  cy - 10);
                    ctx.lineTo(cx + 5,  cy - 10);
                    ctx.lineTo(cx + 5,  cy);
                    ctx.lineTo(cx + 15, cy);
                    ctx.lineTo(cx + 15, cy + 10);
                    ctx.lineTo(cx + 5,  cy + 10);
                    ctx.lineTo(cx + 5,  cy + 20);
                    ctx.lineTo(cx - 5,  cy + 20);
                    ctx.lineTo(cx - 5,  cy + 10);
                    ctx.lineTo(cx - 15, cy + 10);
                    ctx.closePath();

                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (option.id === 'dmg') {

                    const cx = x + w / 2;
                    const cy = y + h / 2;

                    ctx.fillStyle = 'rgb(180, 180, 180)';
                    ctx.fillRect(cx - 5, cy - 5, 10, 20);

                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy - 5);
                    ctx.lineTo(cx,     cy - 20);
                    ctx.lineTo(cx + 5, cy - 5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'rgb(200, 150, 0)';
                    ctx.fillRect(cx - 6, cy - 5, 12, 20);

                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy - 5);
                    ctx.lineTo(cx,     cy - 20);
                    ctx.lineTo(cx + 5, cy - 5);
                    ctx.lineTo(cx + 6, cy + 5);
                    ctx.lineTo(cx + 6, cy + 15);
                    ctx.lineTo(cx - 6, cy + 15);
                    ctx.lineTo(cx - 6, cy + 5);
                    ctx.closePath();

                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                } else if (option.id === 'speed') {

                    const cx = x + w / 2;
                    const cy = y + h / 2;

                    ctx.fillStyle = 'rgb(255, 200, 0)';

                    ctx.beginPath();
                    ctx.moveTo(cx,  cy - 20);
                    ctx.lineTo(cx + 15, cy - 20);
                    ctx.lineTo(cx,      cy - 5);
                    ctx.lineTo(cx + 15, cy - 5);
                    ctx.lineTo(cx - 10, cy + 20);
                    ctx.lineTo(cx - 5,  cy);
                    ctx.lineTo(cx - 15, cy);
                    ctx.closePath();

                    ctx.fill();
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            })
        }

        function handleLevelUpClick(clickX, clickY) {
            if (performance.now() - levelUpScreenOpenTime < levelUpScreenDelay) return;

            levelUpOptions.forEach((option, i) => {
                const x = 100 + i * 170;
                const y = 180;
                const w = 100;
                const h = 160;

                if (clickX >= x && clickX <= x + w && clickY >= y && clickY <= y + h) {
                    option.action();
                    levelUpScreen = false;
                    requestAnimationFrame(gameLoop);
                }
            })
        }

        /**
         * Funkcja tworząca wielu przeciwników
         */
        function spawnWave() {
            if (levelUpScreen) return;
            const size = 2 + Math.floor(Math.random() * 4);
            for (let i = 0; i < size; i++) {
                spawnEnemy();
            }
        }

        /**
         * Funkcja tworząca przeciwnika
         */
        function spawnEnemy() {
            let enemy_pos_x;
            let enemy_pos_y;
            let distance;

            do {
                enemy_pos_x = Math.random() * 640
                enemy_pos_y = Math.random() * 480

                const dx = enemy_pos_x - player_pos_x;
                const dy = enemy_pos_y - player_pos_y;
                distance = Math.sqrt(dx * dx + dy * dy);
            } while (distance < HERO_SAFE_ZONE);
            enemies.push({x: enemy_pos_x, y: enemy_pos_y, speed: ENEMY_SPEED, hp: enemy_hp })
        }

        /**
         * Funkcja rysująca przeciwnika na tkaninie
         */
        function draw_enemy(enemy) {
                const dx = player_pos_x - enemy.x
                const dy = player_pos_y - enemy.y
                const angle = Math.atan2(dx, dy);

                ctx.save();
                ctx.fillStyle = 'rgb(255,0,0)';
                ctx.translate(enemy.x, enemy.y);
                ctx.rotate(angle);
                ctx.fillRect(-5, -15, 30, 30);
                ctx.restore();
        }

        /**
         * Funkcja aktualizująca pozycje przeciwnika
         */
        function update_enemy() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dx = player_pos_x - enemy.x
                const dy = player_pos_y - enemy.y
                const angle = Math.atan2(dx, dy);
                enemy.x += Math.sin(angle) * enemy.speed
                enemy.y += Math.cos(angle) * enemy.speed
            }
        }

        /**
         * Funkcja rysująca pociski na tkaninie
         */
        function draw_projectile(p) {
            ctx.save();
            ctx.fillStyle = 'rgb(0,81,255)';
            ctx.translate(p.x, p.y);
            ctx.fillRect(-5, -15, 5, 5)
            ctx.restore();
        }

        /**
         * Funkcja aktualizująca pozycje pocisków na tkaninie
         */
        function update_projectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i]
                p.x += Math.cos(p.angle) * p.speed
                p.y += Math.sin(p.angle) * p.speed

                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }
        }

        /**
         * Funkcja do obsługi poruszania się postaci
         */
        function handleMovement() {
            if (levelUpScreen || pause) return;
            const left = keys[37] || keys[65]
            const up = keys[38] || keys[87]
            const right = keys[39] || keys[68]
            const down = keys[40] || keys[83]
            let speed

            const diagonal = (left || right) && (up || down)
            if (diagonal) {
                speed = HERO_SPEED / Math.sqrt(2)
            } else {
                speed = HERO_SPEED
            }

            if (left) {
                player_pos_x -= speed
            }
            if (right) {
                player_pos_x += speed
            }
            if (up) {
                player_pos_y -= speed
            }
            if (down) {
                player_pos_y += speed
            }
        }

        /**
         * Funkcja obsługująca zdobywanie poziomu przez gracza
         */
        function handleLevelUp() {
            if (hero_xp >= xp_to_next_level) {
                hero_lvl++;
                showLevelUpScreen();
                enemy_hp = Math.ceil(base_enemy_hp * hero_lvl * 0.75);
                enemy_xp = enemy_hp * base_enemy_xp * 0.4;
                enemy_dmg = Math.ceil(base_enemy_dmg * enemy_hp * 0.75);
                xp_to_next_level = Math.floor(xp_to_next_level * 2.1);
            }
        }

        /**
         * Funkcja sprawdzająca kolizję przeciwników, pocisków oraz przedmiotów
         */
        function checkCollisions() {
            const now = performance.now();

            for (let pickup of pickups) {
                const dx_player = player_pos_x - pickup.x;
                const dy_player = player_pos_y - pickup.y;
                const distance_player = Math.sqrt(dx_player * dx_player + dy_player * dy_player);

                if(hero_hp < hero_max_hp) {
                    if (distance_player <= 25) {
                        pickups.splice(pickups.indexOf(pickup), 1);
                        hero_hp += Math.min(Math.floor(0.25 * hero_max_hp), hero_max_hp - hero_hp);
                    }
                }
            }

            for (let enemy of enemies) {
                if (now - last_time_hit > HIT_COOLDOWN) {
                    const dx_player = player_pos_x - enemy.x;
                    const dy_player = player_pos_y - enemy.y;
                    const distance_player = Math.sqrt(dx_player * dx_player + dy_player * dy_player);

                    if (distance_player < 15) {
                        hero_hp -= enemy_dmg;
                        last_time_hit = now;
                    }
                }

                for (let projectile of projectiles) {
                    const dx = enemy.x - projectile.x;
                    const dy = enemy.y - projectile.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 30) {
                        projectiles.splice(projectiles.indexOf(projectile), 1);
                        enemy.hp -= hero_dmg;
                        if (enemy.hp <= 0) {
                            enemies.splice(enemies.indexOf(enemy), 1)
                            hero_xp += enemy_xp;
                            killed_enemies++;
                            spawnPickup(enemy.x, enemy.y);
                            break;
                        }
                    }
                }
            }
        }

        /**
         * Funkcja rysująca interfejs użytkownika na tkaninie
         */
        function drawUI() {
            ctx.save();

            // HP
            ctx.fillStyle = 'rgb(255,0,0)';
            ctx.translate(0, 0);
            ctx.fillRect(40, 5, 100, 10)
            ctx.fillStyle = 'rgb(0,255,0)';
            ctx.translate(0, 0);
            ctx.fillRect(40, 5, (hero_hp / hero_max_hp) * 100, 10)
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(40, 5, 100, 10);
            ctx.fillStyle = 'rgb(0,0,0)';
            ctx.font = '14px sans-serif';
            ctx.fillText('HP', 20, 15);
            ctx.fillText(hero_hp + ' / ' + hero_max_hp, 175, 15);

            // XP
            ctx.fillText('XP', 20, 30);
            ctx.fillStyle = 'rgba(160,0,255,0)';
            ctx.fillRect(40, 20, 100, 10)
            ctx.translate(0, 0);
            ctx.fillStyle = 'rgb(160,0,255)';
            ctx.fillRect(40, 20, (hero_xp / xp_to_next_level) * 100, 10)
            ctx.translate(0, 0);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(40, 20, 100, 10);

            // LVL
            ctx.font = '12px sans-serif';
            ctx.fillText('LVL ' + hero_lvl, 20, 45);


            ctx.restore();
        }

        /**
         * Funkcja wywoływana cyklicznie przerysowująca tkaninę
         */
        function redraw() {
            ctx.clearRect(0, 0, 640, 480);
            handleMovement()
            handleLevelUp()

            for (const pickup of pickups) {
                drawPickup(pickup);
            }
            draw_hero();

            for (const e of enemies) {
                draw_enemy(e)
            }
            update_enemy()

            for (const p of projectiles) {
                draw_projectile(p);
            }
            update_projectiles();

            drawUI();
            checkCollisions();

            if (hero_hp <= 0) {
                handleGameOver();
            }
            drawLevelUpScreen();
        }
        /**
         * Funkcja inicjalizująca grę i tworząca ekran powitalny
         */
        function init() {
            window.addEventListener("keydown", keyDownListener);
            window.addEventListener("keyup", keyUpListener);
            window.addEventListener("mousemove", mouseMovementListener);
            window.addEventListener("click", mouseClickListener);
            canvas = document.getElementById('game');
            ctx = canvas.getContext('2d');
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('READY PLAYER ONE?', 320, 240);
            draw_hero();
        }
        /**
         * Funkcja obsługi naciśnięcia przycisku
         */
        function keyDownListener(e) {
            keys[e.keyCode] = true;
            clear_welcome();

            if (game_over && e.keyCode === 82) {
                restartGame();
            }

            if(!pause && (!game_over || !levelUpScreen) && e.keyCode === 27) {
                pause = true;
                clearInterval(spawnInterval);
            } else if (pause && e.keyCode === 27) {
                pause = false;
                requestAnimationFrame(gameLoop);
                spawnInterval = setInterval(spawnWave, enemySpawnCooldown)
            }
        }

        /**
         * Funkcja obsługi wyciśnięcia przycisku
         */
        function keyUpListener(e) {
            keys[e.keyCode] = false;
        }

        /**
         * Funkcja obsługi ruchu myszy
         */
        function mouseMovementListener(e) {
            const rect = canvas.getBoundingClientRect();
            mouse_x = e.clientX - rect.left;
            mouse_y = e.clientY - rect.top;
        }

        /**
         * Funkcja obsługi naciśnięcia przycisku myszy
         */
        function mouseClickListener(e) {
            clear_welcome()
            if (pause) return;

            if (levelUpScreen) {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                handleLevelUpClick(clickX, clickY);
                return;
            }


            const angle = Math.atan2(mouse_y - player_pos_y, mouse_x - player_pos_x);
            projectiles.push({
                x: player_pos_x,
                y: player_pos_y,
                angle: angle,
                speed: PROJECTILE_SPEED
            })
        }

        /**
         * Funkcja resetująca stan gry
         */
        function restartGame() {

            player_pos_x = 320
            player_pos_y = 300;
            mouse_x = 0;
            mouse_y = 0;
            hero_hp = 100
            hero_max_hp = 100
            hero_xp = 0;
            hero_lvl = 1;
            xp_to_next_level = 1000;
            enemy_hp = base_enemy_hp;
            enemy_xp = base_enemy_xp;
            enemy_dmg = base_enemy_dmg;
            last_time_hit = 0;

            killed_enemies = 0;

            enemies.length = 0;
            projectiles.length = 0;
            pickups.length = 0;
            game_over = false;
            requestAnimationFrame(gameLoop);
            spawnInterval = setInterval(spawnWave, enemySpawnCooldown)
        }

        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, 640, 480);
            ctx.fillStyle = 'white';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('PAUZA', 320, 240);
            ctx.font = '20px sans-serif';
            ctx.fillText('Naciśnij ESC aby kontynuować', 320, 300);
        }

        /**
         * Główna pętla gry
         */
        function gameLoop() {
            if (game_over) return;
            if (levelUpScreen) return;
            if (pause) {
                drawPauseScreen()
                return;
            }
            redraw()
            requestAnimationFrame(gameLoop);
        }
    </script>
</head>

<body onload="init()">
    <div id="main">
        <canvas id="game" width="640" height="480">
            Zacznij w końcu używać współczesnej przeglądarki!
        </canvas>
    </div>
</body>

</html>
