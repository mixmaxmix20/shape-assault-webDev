<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        #main {
            width: 640px;
            height: 480px;
            margin: auto;
            border: 1px solid black;
            background-color: navajowhite;
        }
    </style>

    <script>
        let canvas;
        let ctx;

        let welcomeScreen = true;
        let gameOver = false;
        let pause = false;
        let levelUpScreen = false;

        let playerPosX = 320, playerPosY = 300;
        const keys = {};
        let mouseX = 0;
        let mouseY = 0;

        let levelUpScreenOpenTime = 0;
        const LEVEL_UP_SCREEN_DELAY = 750;

        let heroSpeed = 1;
        let heroHp = 50;
        let heroMaxHp = 50;
        let heroXp = 0;
        let heroLvl = 1;
        let heroDmg = 1;
        let xpToNextLvl = 100;

        const PROJECTILE_SPEED = 5;
        const HERO_SAFE_ZONE = 150;
        const HIT_COOLDOWN = 500;
        let lastTimeHit = 0;

        const projectiles = [];
        const enemies = [];
        const pickups = [];
        let levelUpOptions = [];

        let killedBasicEnemies = 0;
        let killedFastEnemies = 0;
        let killedTankEnemies = 0;
        let killedBossEnemies = 0;

        // Spawn przeciwników
        const ENEMY_SPAWN_COOLDOWN = 1500;
        let spawnInterval = null;

        const FAST_START  = 2;
        const TANK_START  = 6;
        const BOSS_START  = 11;

        const BASIC_DECAY = 2;
        const FAST_GROW   = 3;
        const TANK_GROW   = 1;
        const BOSS_GROW   = 0.5;

        const enemyTypes = {
            basic:   { color: 'rgb(255, 0, 0)',   speed: 1.0, hp: 1, xp: 10, dmg: 10, hitRadius: 20 },
            fast:    { color: 'rgb(255, 165, 0)', speed: 2.0, hp: 10, xp: 35, dmg: 20, hitRadius: 25 },
            tank:    { color: 'rgb(128, 0, 128)', speed: 0.5, hp: 50, xp: 100, dmg: 30, hitRadius: 30 },
            boss:    { color: 'rgb(0, 0, 0)',     speed: 0.8, hp: 250, xp: 500, dmg: 75, hitRadius: 40 },
        };

        /**
         * Funkcja czyszcząca ekran powitalny
         */
        function clearWelcome() {
            if (welcomeScreen) {
                ctx.clearRect(0, 0, 640, 480);
                welcomeScreen = false;
                requestAnimationFrame(gameLoop);
                spawnInterval = setInterval(spawnWave, ENEMY_SPAWN_COOLDOWN);
            }
        }

        /**
         * Funkcja obsługująca koniec rozgrywki
         */
        function handleGameOver() {
            gameOver = true;
            clearInterval(spawnInterval);

            ctx.clearRect(0, 0, 640, 480);

            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgb(0, 0, 0)';
            ctx.fillText('GAME OVER', 320, 200);

            ctx.font = '24px sans-serif';
            ctx.fillText('Poziom: ' + heroLvl, 320, 240);
            ctx.fillText('Pokonani zwykli przeciwnicy: ' + killedBasicEnemies, 320, 280);
            ctx.fillText('Pokonani szybcy przeciwnicy: ' + killedFastEnemies, 320, 320);
            ctx.fillText('Pokonani twardzi przeciwnicy: ' + killedTankEnemies, 320, 360);
            ctx.fillText('Pokonani Bossowie: ' + killedBossEnemies, 320, 400);
            ctx.fillText('Naciśnij R aby zagrać ponownie', 320, 440);
        }
        /**
         * Funkcja rysująca bohatera na tkaninie
         */
        function drawHero() {
            const angle = Math.atan2(mouseY - playerPosY, mouseX - playerPosX);
            ctx.save();
            ctx.fillStyle = 'rgb(18 104 1)';
            ctx.translate(playerPosX, playerPosY);
            ctx.rotate(angle);
            ctx.fillRect(-5, -15, 10, 30);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(-5, -15, 10, 30);


            ctx.beginPath();
            ctx.arc(3, 0, 8, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgb(246 201 201)';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = 'rgb(0 0 0)';
            ctx.fillRect(5, 15, 8, 1);
            ctx.restore();
        }

        /**
         * Funkcja tworząca przedmioty do podniesienia
         */
        function spawnPickup(ePosX, ePosY) {
            const randomNum = Math.random();
            if (randomNum < 0.01) {
                pickups.push({x: ePosX, y: ePosY, type: 'hp'});
            }
        }

        /**
         * Funkcja rysująca przedmioty na ekranie
         */
        function drawPickup(pickup) {

            ctx.save();
            ctx.translate(pickup.x, pickup.y);
            ctx.fillStyle = 'rgb(255,0,0)';
            ctx.fillRect(-8, -3, 16, 6);
            ctx.fillRect(-3, -8, 6, 16);

            ctx.beginPath();
            ctx.moveTo(-8, -3);
            ctx.lineTo(-3, -3);
            ctx.lineTo(-3, -8);
            ctx.lineTo( 3, -8);
            ctx.lineTo( 3, -3);
            ctx.lineTo( 8, -3);
            ctx.lineTo( 8,  3);
            ctx.lineTo( 3,  3);
            ctx.lineTo( 3,  8);
            ctx.lineTo(-3,  8);
            ctx.lineTo(-3,  3);
            ctx.lineTo(-8,  3);
            ctx.closePath();

            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        function showLevelUpScreen() {
            levelUpScreen = true;
            levelUpScreenOpenTime = performance.now();
            levelUpOptions = [
                { id: 'hp', label: 'HP +25%', action: () => { heroMaxHp = Math.floor(heroMaxHp * 1.25); heroHp = heroMaxHp; }},
                { id: 'dmg', label: 'Obrażenia +1', action: () => {heroDmg++; } },
                { id: 'speed', label: 'Szybkość +25%', action: () => { heroSpeed += 0.25; } },
            ];
        }

        function drawLevelUpScreen() {
            if (!levelUpScreen) return;
            ctx.save();
            ctx.fillStyle = 'rgb(150 255 159)';
            ctx.fillRect(80, 80, 480, 320);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(80, 80, 480, 320);

            ctx.fillStyle = 'black';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Wybierz ulepszenie:', 320, 120);

            levelUpOptions.forEach((option, i) => {
                const x = 100 + i * 160;
                const y = 180;
                const w = 120;
                const h = 160;

                ctx.fillStyle = 'rgb(203,203,203)';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);

                ctx.fillStyle = 'black';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(option.label, x + w / 2, y + 20);
                if (option.id === 'hp') {

                    const cx = x + w / 2;
                    const cy = y + h / 2;

                    ctx.fillStyle = 'rgb(255,0,0)';
                    ctx.fillRect(cx - 15, cy, 30, 10);
                    ctx.fillRect(cx - 5, cy - 10, 10, 30);

                    ctx.beginPath();
                    ctx.moveTo(cx - 15, cy);
                    ctx.lineTo(cx - 5,  cy);
                    ctx.lineTo(cx - 5,  cy - 10);
                    ctx.lineTo(cx + 5,  cy - 10);
                    ctx.lineTo(cx + 5,  cy);
                    ctx.lineTo(cx + 15, cy);
                    ctx.lineTo(cx + 15, cy + 10);
                    ctx.lineTo(cx + 5,  cy + 10);
                    ctx.lineTo(cx + 5,  cy + 20);
                    ctx.lineTo(cx - 5,  cy + 20);
                    ctx.lineTo(cx - 5,  cy + 10);
                    ctx.lineTo(cx - 15, cy + 10);
                    ctx.closePath();

                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (option.id === 'dmg') {

                    const cx = x + w / 2;
                    const cy = y + h / 2;

                    ctx.fillStyle = 'rgb(180, 180, 180)';
                    ctx.fillRect(cx - 5, cy - 5, 10, 20);

                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy - 5);
                    ctx.lineTo(cx,     cy - 20);
                    ctx.lineTo(cx + 5, cy - 5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'rgb(200, 150, 0)';
                    ctx.fillRect(cx - 6, cy - 5, 12, 20);

                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy - 5);
                    ctx.lineTo(cx,     cy - 20);
                    ctx.lineTo(cx + 5, cy - 5);
                    ctx.lineTo(cx + 6, cy + 5);
                    ctx.lineTo(cx + 6, cy + 15);
                    ctx.lineTo(cx - 6, cy + 15);
                    ctx.lineTo(cx - 6, cy + 5);
                    ctx.closePath();

                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                } else if (option.id === 'speed') {
                    const cx = x + w / 2;
                    const cy = y + h / 2;

                    ctx.fillStyle = 'rgb(255, 200, 0)';

                    ctx.beginPath();
                    ctx.moveTo(cx,  cy - 20);
                    ctx.lineTo(cx + 15, cy - 20);
                    ctx.lineTo(cx,      cy - 5);
                    ctx.lineTo(cx + 15, cy - 5);
                    ctx.lineTo(cx - 10, cy + 20);
                    ctx.lineTo(cx - 5,  cy);
                    ctx.lineTo(cx - 15, cy);
                    ctx.closePath();

                    ctx.fill();
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            })
        }

        function handleLevelUpClick(clickX, clickY) {
            if (performance.now() - levelUpScreenOpenTime < LEVEL_UP_SCREEN_DELAY) return;

            levelUpOptions.forEach((option, i) => {
                const x = 100 + i * 160;
                const y = 180;
                const w = 120;
                const h = 160;

                if (clickX >= x && clickX <= x + w && clickY >= y && clickY <= y + h) {
                    option.action();
                    levelUpScreen = false;
                    requestAnimationFrame(gameLoop);
                }
            })
        }

        function getSpawnWeights() {
            const lvl = heroLvl;
            return [
                Math.max(0, 100 - lvl * BASIC_DECAY),
                Math.max(0, (lvl - FAST_START  + 1) * FAST_GROW),
                Math.max(0, (lvl - TANK_START  + 1) * TANK_GROW),
                Math.max(0, (lvl - BOSS_START  + 1) * BOSS_GROW),
            ];
        }

        function getEnemyType() {
            const weights = getSpawnWeights();
            const types = Object.keys(enemyTypes);

            const total = weights.reduce((sum, weight) => sum + weight, 0);

            let randomNum = Math.random() * total;

            for (let i = 0; i < types.length; i++) {
                randomNum -= weights[i];
                if (randomNum <= 0) return types[i];
            }
        }

        /**
         * Funkcja tworząca wielu przeciwników
         */
        function spawnWave() {
            if (levelUpScreen) return;
            const size = 2 + Math.floor(Math.random() * 4);
            for (let i = 0; i < size; i++) {
                spawnEnemy();
            }
        }

        /**
         * Funkcja tworząca przeciwnika
         */
        function spawnEnemy() {
            let enemyPosX;
            let enemyPosY;
            let distance;

            do {
                enemyPosX = Math.random() * 640;
                enemyPosY = Math.random() * 480;

                const dx = enemyPosX - playerPosX;
                const dy = enemyPosY - playerPosY;
                distance = Math.sqrt(dx * dx + dy * dy);
            } while (distance < HERO_SAFE_ZONE);

            const type = getEnemyType();
            const enemy = enemyTypes[type];

            enemies.push({x: enemyPosX, y: enemyPosY, type: type, color: enemy.color, speed: enemy.speed, hp: enemy.hp, xp: enemy.xp, dmg: enemy.dmg, hitRadius: enemy.hitRadius});
        }

        /**
         * Funkcja rysująca przeciwnika na tkaninie
         */
        function drawEnemy(enemy) {
            const dx = playerPosX - enemy.x;
            const dy = playerPosY - enemy.y;
            const angle = Math.atan2(dy, dx);

            ctx.save();
            ctx.fillStyle = enemy.color;
            ctx.translate(enemy.x, enemy.y);
            ctx.rotate(angle);

            if(enemy.type === 'basic') {
                ctx.fillRect(-10, -10, 20, 20);
            } else if (enemy.type === 'fast') {
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-10, -8);
                ctx.lineTo(-10, 8);
                ctx.closePath();
                ctx.fill();
            } else if (enemy.type === 'tank') {
                ctx.fillRect(-15, -15, 30, 30);
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.strokeRect(-15, -15, 30, 30);
            } else if (enemy.type === 'boss') {
                ctx.beginPath();
                ctx.arc(0, 0, 40, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        /**
         * Funkcja aktualizująca pozycje przeciwnika
         */
        function updateEnemy() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dx = playerPosX - enemy.x;
                const dy = playerPosY - enemy.y;
                const angle = Math.atan2(dx, dy);
                enemy.x += Math.sin(angle) * enemy.speed;
                enemy.y += Math.cos(angle) * enemy.speed;
            }
        }

        /**
         * Funkcja rysująca pociski na tkaninie
         */
        function drawProjectile(p) {
            ctx.save();
            ctx.fillStyle = 'rgb(0 0 0)';
            ctx.translate(p.x, p.y);
            ctx.beginPath();
            ctx.arc(0, 0, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        /**
         * Funkcja aktualizująca pozycje pocisków na tkaninie
         */
        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += Math.cos(p.angle) * p.speed;
                p.y += Math.sin(p.angle) * p.speed;

                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }
        }

        /**
         * Funkcja do obsługi poruszania się postaci
         */
        function handleMovement() {
            if (levelUpScreen || pause) return;
            const left = keys[37] || keys[65];
            const up = keys[38] || keys[87];
            const right = keys[39] || keys[68];
            const down = keys[40] || keys[83];
            let speed;

            const diagonal = (left || right) && (up || down);
            if (diagonal) {
                speed = heroSpeed / Math.sqrt(2);
            } else {
                speed = heroSpeed;
            }

            if (left) {
                playerPosX -= speed;
            }
            if (right) {
                playerPosX += speed;
            }
            if (up) {
                playerPosY -= speed;
            }
            if (down) {
                playerPosY += speed;
            }

            // blokada wyjścia poza plansze
            playerPosX = Math.max(10, Math.min(630, playerPosX));
            playerPosY = Math.max(10, Math.min(470, playerPosY));
        }

        /**
         * Funkcja obsługująca zdobywanie poziomu przez gracza
         */
        function handleLevelUp() {
            if (heroXp >= xpToNextLvl) {
                heroLvl++;
                showLevelUpScreen();
                xpToNextLvl = Math.floor(xpToNextLvl * 1.5);
            }
        }

        /**
         * Funkcja sprawdzająca kolizję przeciwników, pocisków oraz przedmiotów
         */
        function checkCollisions() {
            const now = performance.now();

            for (let pickup of pickups) {
                const dxPlayer = playerPosX - pickup.x;
                const dyPlayer = playerPosY - pickup.y;
                const distanceToPlayer = Math.sqrt(dxPlayer * dxPlayer + dyPlayer * dyPlayer);

                if(heroHp < heroMaxHp) {
                    if (distanceToPlayer <= 25) {
                        pickups.splice(pickups.indexOf(pickup), 1);
                        heroHp += Math.min(Math.floor(0.25 * heroMaxHp), heroMaxHp - heroHp);
                    }
                }
            }

            for (let enemy of enemies) {
                if (now - lastTimeHit > HIT_COOLDOWN) {
                    const dxPlayer = playerPosX - enemy.x;
                    const dyPlayer = playerPosY - enemy.y;
                    const distanceToPlayer = Math.sqrt(dxPlayer * dxPlayer + dyPlayer * dyPlayer);

                    if (distanceToPlayer <= enemy.hitRadius) {
                        heroHp -= enemy.dmg;
                        lastTimeHit = now;
                    }
                }

                for (let projectile of projectiles) {
                    const dx = enemy.x - projectile.x;
                    const dy = enemy.y - projectile.y;
                    const distanceToEnemy = Math.sqrt(dx * dx + dy * dy);

                    if (distanceToEnemy <= enemy.hitRadius) {
                        projectiles.splice(projectiles.indexOf(projectile), 1);
                        enemy.hp -= heroDmg;
                        if (enemy.hp <= 0) {
                            enemies.splice(enemies.indexOf(enemy), 1);
                            heroXp += enemy.xp;
                            switch (enemy.type) {
                                case 'basic':
                                    killedBasicEnemies++;
                                    break;
                                case 'fast':
                                    killedFastEnemies++;
                                    break;
                                case 'tank':
                                    killedTankEnemies++;
                                    break;
                                case 'boss':
                                    killedBossEnemies++;
                                    break;
                            }
                            spawnPickup(enemy.x, enemy.y);
                            break;
                        }
                    }
                }
            }
        }

        /**
         * Funkcja rysująca interfejs użytkownika na tkaninie
         */
        function drawUI() {
            ctx.save();

            // HP
            ctx.fillStyle = 'rgb(255,0,0)';
            ctx.translate(0, 0);
            ctx.fillRect(40, 5, 100, 10);
            ctx.fillStyle = 'rgb(0,255,0)';
            ctx.translate(0, 0);
            ctx.fillRect(40, 5, (heroHp / heroMaxHp) * 100, 10);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(40, 5, 100, 10);
            ctx.fillStyle = 'rgb(0,0,0)';
            ctx.font = '14px sans-serif';
            ctx.fillText('HP', 20, 15);
            ctx.fillText(heroHp + ' / ' + heroMaxHp, 175, 15);

            // XP
            ctx.fillText('XP', 20, 30);
            ctx.fillStyle = 'rgba(160,0,255,0)';
            ctx.fillRect(40, 20, 100, 10);
            ctx.translate(0, 0);
            ctx.fillStyle = 'rgb(160,0,255)';
            ctx.fillRect(40, 20, (heroXp / xpToNextLvl) * 100, 10);
            ctx.translate(0, 0);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(40, 20, 100, 10);

            // LVL
            ctx.font = '12px sans-serif';
            ctx.fillText('LVL ' + heroLvl, 20, 45);

            ctx.restore();
        }

        /**
         * Funkcja wywoływana cyklicznie przerysowująca tkaninę
         */
        function redraw() {
            ctx.clearRect(0, 0, 640, 480);
            handleMovement();
            handleLevelUp();

            for (const pickup of pickups) {
                drawPickup(pickup);
            }
            drawHero();

            for (const e of enemies) {
                drawEnemy(e);
            }
            updateEnemy();

            for (const p of projectiles) {
                drawProjectile(p);
            }
            updateProjectiles();

            drawUI();
            checkCollisions();

            if (heroHp <= 0) {
                handleGameOver();
            }
            drawLevelUpScreen();
        }
        /**
         * Funkcja inicjalizująca grę i tworząca ekran powitalny
         */
        function init() {
            window.addEventListener("keydown", keyDownListener);
            window.addEventListener("keyup", keyUpListener);
            window.addEventListener("mousemove", mouseMovementListener);
            window.addEventListener("click", mouseClickListener);
            canvas = document.getElementById('game');
            ctx = canvas.getContext('2d');

            ctx.font = 'bold 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SHAPE ASSAULT', 323, 223);

            ctx.fillStyle = 'rgb(255, 60, 60)';
            ctx.fillText('SHAPE', 208, 220)

            ctx.fillStyle = 'rgb(61 255 76)';
            ctx.fillText('ASSAULT', 416, 220)


            ctx.fillStyle = 'rgb(0 0 0)';
            ctx.font = '24px sans-serif';
            ctx.fillText('Naciśnij dowolny przycisk, aby rozpocząć', 320, 260)
            drawHero();
        }
        /**
         * Funkcja obsługi naciśnięcia przycisku
         */
        function keyDownListener(e) {
            keys[e.keyCode] = true;
            clearWelcome();

            if (gameOver && e.keyCode === 82) {
                restartGame();
            }

            if(!pause && (!gameOver || !levelUpScreen) && e.keyCode === 27) {
                pause = true;
                clearInterval(spawnInterval);
            } else if (pause && e.keyCode === 27) {
                pause = false;
                requestAnimationFrame(gameLoop);
                spawnInterval = setInterval(spawnWave, ENEMY_SPAWN_COOLDOWN);
            }
        }

        /**
         * Funkcja obsługi wyciśnięcia przycisku
         */
        function keyUpListener(e) {
            keys[e.keyCode] = false;
        }

        /**
         * Funkcja obsługi ruchu myszy
         */
        function mouseMovementListener(e) {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        }

        /**
         * Funkcja obsługi naciśnięcia przycisku myszy
         */
        function mouseClickListener(e) {
            clearWelcome()
            if (pause) return;

            if (levelUpScreen) {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                handleLevelUpClick(clickX, clickY);
                return;
            }

            const angle = Math.atan2(mouseY - playerPosY, mouseX - playerPosX);
            projectiles.push({
                x: playerPosX,
                y: playerPosY,
                angle: angle,
                speed: PROJECTILE_SPEED
            });
        }

        /**
         * Funkcja resetująca stan gry
         */
        function restartGame() {
            playerPosX = 320;
            playerPosY = 300;
            mouseX = 0;
            mouseY = 0;
            heroHp = 50;
            heroMaxHp = 50;
            heroXp = 0;
            heroLvl = 1;
            xpToNextLvl = 100;
            lastTimeHit = 0;
            heroSpeed = 1;
            heroDmg = 1;

            killedBasicEnemies = 0;
            killedFastEnemies = 0;
            killedTankEnemies = 0;
            killedBossEnemies = 0;

            enemies.length = 0;
            projectiles.length = 0;
            pickups.length = 0;
            gameOver = false;
            requestAnimationFrame(gameLoop);
            spawnInterval = setInterval(spawnWave, ENEMY_SPAWN_COOLDOWN);
        }

        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, 640, 480);
            ctx.fillStyle = 'white';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('PAUZA', 320, 240);
            ctx.font = '20px sans-serif';
            ctx.fillText('Naciśnij ESC aby kontynuować', 320, 300);
        }

        /**
         * Główna pętla gry
         */
        function gameLoop() {
            if (gameOver) return;
            if (levelUpScreen) return;
            if (pause) {
                drawPauseScreen();
                return;
            }
            redraw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</head>

<body onload="init()">
    <div id="main">
